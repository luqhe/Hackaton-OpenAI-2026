<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Guardian — proteção contextual e letramento digital para famílias."
    />
    <meta name="theme-color" content="#143b32" />
    <title>Guardian · Family Safety</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="Guardian — início">
          <span class="brand-mark" aria-hidden="true">G</span>
          <span>Guardian</span>
        </a>
        <nav class="nav" aria-label="Navegação principal">
          <a href="/" data-route="dashboard">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M3 11.5 12 4l9 7.5" />
              <path d="M5.5 10.5V20h13v-9.5M9.5 20v-6h5v6" />
            </svg>
            <span>Visão geral</span>
          </a>
          <a href="/child" data-route="child">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="3.5" />
              <path d="M5.5 20c.5-4 2.8-6 6.5-6s6 2 6.5 6" />
            </svg>
            <span>Lucas</span>
          </a>
          <a href="/settings" data-route="settings">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
              <circle cx="16" cy="7" r="2" />
              <circle cx="8" cy="17" r="2" />
            </svg>
            <span>Políticas</span>
          </a>
        </nav>
        <div class="sidebar-foot">
          <div class="mini-avatar" aria-hidden="true">MF</div>
          <div><strong>Marina Ferreira</strong><span>Responsável</span></div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="page-eyebrow">FAMÍLIA FERREIRA</p>
            <h1 id="page-title">Visão geral</h1>
          </div>
          <div class="protection-pill demo" id="protection-status">
            <span class="protection-dot" aria-hidden="true"></span>
            <span class="protection-label">Verificando modo…</span>
          </div>
        </header>

        <div
          id="toast"
          class="toast"
          role="status"
          aria-live="polite"
          hidden
        ></div>
        <section id="app" aria-live="polite">
          <div class="loading-card">
            <span class="spinner" aria-hidden="true"></span> Carregando
            proteção…
          </div>
        </section>
      </main>
    </div>
    <noscript
      >O dashboard do Guardian precisa de JavaScript para consultar a API
      local.</noscript
    >
  </body>
</html>
