<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Guardian — acompanhamento de segurança digital para famílias."
    />
    <meta name="theme-color" content="#143b32" />
    <title>Guardian · Proteção familiar</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/stage4-transparency.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Ir para o conteúdo principal</a>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="Guardian — início">
          <span class="brand-mark" aria-hidden="true">G</span>
          <span>Guardian</span>
        </a>
        <nav class="nav" aria-label="Navegação principal">
          <a href="/" data-route="dashboard">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 10.8 12 3l9 7.8" />
              <path d="M5.5 9.5V21h13V9.5M9.5 21v-6h5v6" />
            </svg>
            <span class="nav-label">Visão geral</span>
          </a>
          <a href="/child" data-route="child">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" />
              <path d="M5.5 20c.7-4 3-6 6.5-6s5.8 2 6.5 6" />
            </svg>
            <span class="nav-label">Lucas</span>
          </a>
          <a href="/settings" data-route="settings">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 3.5 19 6v5.2c0 4.5-2.7 7.8-7 9.3-4.3-1.5-7-4.8-7-9.3V6l7-2.5Z"
              />
              <path d="M9 11.5h6M10.5 8.5h3M10.5 14.5h3" />
            </svg>
            <span class="nav-label">Políticas</span>
          </a>
          <a href="/family" data-route="family">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="9" cy="8" r="3" />
              <circle cx="17" cy="10" r="2.5" />
              <path
                d="M3.5 20c.6-4 2.5-6 5.5-6s4.9 2 5.5 6M14 15c3 0 5 1.7 5.5 5"
              />
            </svg>
            <span class="nav-label">Família</span>
          </a>
          <a href="/support" data-route="support">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path
                d="M9.7 9a2.5 2.5 0 1 1 3.3 2.4c-.7.3-1 1-1 1.8M12 17h.01"
              />
            </svg>
            <span class="nav-label">Suporte</span>
          </a>
        </nav>
        <div class="sidebar-foot">
          <div class="mini-avatar" aria-hidden="true">MF</div>
          <div><strong>Marina Ferreira</strong><span>Responsável</span></div>
        </div>
      </aside>

      <main class="main" id="main-content" tabindex="-1">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="page-eyebrow">FAMÍLIA FERREIRA</p>
            <h1 id="page-title">Visão geral</h1>
          </div>
          <div
            class="protection-pill simulated"
            id="protection-status"
            role="status"
            aria-live="polite"
          >
            <span class="protection-dot" aria-hidden="true"></span>
            <span class="protection-label">Verificando modo…</span>
          </div>
        </header>

        <div
          id="toast"
          class="toast"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          hidden
        ></div>
        <section id="app" aria-live="polite">
          <div class="loading-card">
            <span class="spinner" aria-hidden="true"></span> Carregando
            proteção…
          </div>
        </section>
      </main>
    </div>
    <noscript
      >O dashboard do Guardian precisa de JavaScript para consultar a API
      local.</noscript
    >
  </body>
</html>
