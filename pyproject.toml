[project]
name = "guardian-mvp"
version = "0.1.0"
description = "Guardian contextual digital-safety MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["agent*", "api*", "guardian_core*", "risk_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --basetemp=.test-runtime"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [".venv", ".test-runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
