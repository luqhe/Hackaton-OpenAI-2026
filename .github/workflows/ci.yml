name: CI

on:
  pull_request:
  push:
    branches: [main, "agent/android-mobile-port"]

permissions:
  contents: read

concurrency:
  group: guardian-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate Stage 0 contracts
        run: python scripts/validate_stage0.py
      - name: Run frozen R3 risk regression and shadow safety checks
        run: python scripts/run_r3_evals.py --check
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check agent api guardian_core risk_engine scripts tests
      - name: Test
        run: python -m pytest

  web:
    name: Web lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Syntax
        run: pnpm check:js
      - name: Lint
        run: pnpm lint:js
      - name: Format
        run: pnpm format:check

  macos-native:
    name: macOS native build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build helper
        run: swift build --package-path native/GuardianCaptureHelper
      - name: Validate shell and plist
        run: |
          bash -n scripts/package-macos.sh
          bash -n scripts/install-macos-dev.sh
          plutil -lint packaging/macos/com.guardian.agent.plist
      - name: Test native boundaries
        run: python -m pytest tests/test_native_helper.py tests/test_observer.py tests/test_enforcer.py
