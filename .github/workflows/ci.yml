name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guardian-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate Stage 0 contracts
        run: python scripts/validate_stage0.py
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check agent api guardian_core risk_engine scripts tests
      - name: Test
        run: python -m pytest

  web:
    name: Web lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Syntax
        run: pnpm check:js
      - name: Lint
        run: pnpm lint:js
      - name: Format
        run: pnpm format:check
